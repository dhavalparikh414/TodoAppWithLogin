name: send-reminders
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS --max-time 120 -X POST
          -H "X-Reminder-Key: ${{ secrets.REMINDER_KEY }}"
          https://todoapp.com.au/api/send-reminders
