name: send-reminders
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.APP_URL }}
      REMINDER_KEY: ${{ secrets.REMINDER_KEY }}
    steps:
      - name: Check config
        run: |
          if [ -z "$APP_URL" ] || [ -z "$REMINDER_KEY" ]; then
            echo "APP_URL variable or REMINDER_KEY secret is not set"; exit 1
          fi
      - name: Wake the service
        run: |
          curl -sS -o /dev/null --max-time 90 \
            --retry 4 --retry-delay 15 --retry-all-errors \
            "$APP_URL/"
      - name: Call reminder endpoint
        run: |
          curl -fsS --max-time 60 --retry 2 --retry-delay 10 \
            -X POST -H "X-Reminder-Key: $REMINDER_KEY" \
            "$APP_URL/api/send-reminders"
